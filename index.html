<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css"
      integrity="sha512-1sCRPdkRXhBV2PBLUdRb4tMg1w2YPf37qatUFeS7zlBy7jJI8Lf4VHwWfZZfpXtYSLy85pkm9GaYVYMfw5BC1A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg" />
    <link rel="shortcut icon" href="images/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="images/favicon/site.webmanifest" />

    <!-- CSS Style -->
    <link rel="stylesheet" href="styles/style.css" />

    <title>Document</title>
  </head>
  <body>
    <!-- This anchor here is an accessibility feature. It allows keyboard and screen reader users to skip repetitive navigation and go directly to the main content. -->
    <a class="visually-hidden skip" href="#main">Skip to main content</a>

    <!-- ! Header -->
    <header id="header">
      <!-- ? Top Nav -->
      <div class="topnav">
        <div class="wrapper topnav__wrapper">
          <!-- Languages -->
          <div class="topnav__lang">
            <i class="fa-solid fa-globe" aria-hidden="true"></i>
            <a href="" class="active">EN</a>
            <span>|</span>
            <a href="">FR</a>
            <span>|</span>
            <a href="">AR</a>
          </div>

          <!-- contact -->
          <address class="topnav__contact">
            <a href="tel:+212611959007" class="contact-link">
              <i class="fa-solid fa-phone-volume" aria-hidden="true"></i>
              <span>+212 611 95 90 07</span>
            </a>
            <a href="mailto:info@sibionics.com" class="contact-link">
              <i class="fa-solid fa-envelope" aria-hidden="true"></i>
              <span>info@sibionics.com</span>
            </a>
          </address>
        </div>
      </div>
      <!-- ? Main Nav -->
      <div class="wrapper mainNav__wrapper">
        <!-- Logo -->
        <div class="mainNav__logo">
          <a href="#home" aria-label="Sibionics GS1 Home">
            SIBI<span>O</span>NICS <span>GS1</span>
          </a>
        </div>

        <!-- Navigation Links -->
        <nav
          class="mainNav__menu"
          id="mainNavMenu"
          aria-label="Main navigation"
        >
          <ul class="mainNav__list">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#how-it-works">How It Works</a></li>
            <li><a href="#faq">FAQ</a></li>
            <li><a href="#blog">Blog</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
        </nav>
        <!-- Buy Button -->
        <div class="mainNav__buyBtn">
          <a href="">
            <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
            <span>Buy Now</span>
          </a>
        </div>
        <!-- Mobile Menu Button -->
        <button
          class="mainNav__toggle"
          type="button"
          aria-label="Open navigation menu"
          aria-expanded="false"
          aria-controls="mainNavMenu"
        >
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- ! Main -->
    <main id="main"></main>

    <!-- ! Footer -->
    <footer id="footer"></footer>
  </body>
</html>
